<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Noto Sans KR', sans-serif;
    position:relative;
    background:
      radial-gradient(ellipse 900px 500px at 78% 15%, rgba(255,199,120,0.35) 0%, rgba(255,199,120,0) 60%),
      linear-gradient(155deg, #2a1509 0%, #5a2f12 35%, #8a4a17 68%, #b5701f 100%);
  }
  .frame {
    position:absolute; inset:22px;
    border:2px solid rgba(255,217,138,0.45);
    border-radius:18px;
  }
  .pill {
    position:absolute; top:56px; left:64px;
    font-size:17px; font-weight:700; letter-spacing:0.22em;
    color:#3d2211; background:#ffd98a;
    padding:8px 20px; border-radius:30px;
  }
  .title {
    position:absolute; top:118px; left:64px;
    font-size:64px; font-weight:900; color:#fff8ec;
    line-height:1.28; text-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }
  .title b { color:#ffcf5c; }
  .subtitle {
    position:absolute; top:340px; left:64px;
    font-size:24px; font-weight:500; color:#f3d9b6;
  }
  .footer-tag {
    position:absolute; bottom:52px; left:64px;
    font-size:18px; font-weight:700; color:#f3caa0;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
    padding:7px 18px; border-radius:24px;
  }
  .verse {
    position:absolute; top:60px; right:64px;
    font-size:15px; color:#e8c9a0; font-style:italic; text-align:right;
    max-width:320px; line-height:1.6;
  }
  svg { position:absolute; }
</style>
</head>
